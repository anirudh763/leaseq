name: ci

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseq
          POSTGRES_PASSWORD: leaseq
          POSTGRES_DB: leaseq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseq -d leaseq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@localhost:5432/leaseq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # The tests create their own random API token (tests/conftest.py, scripts/harness.py).
      - run: python -m pytest -v

  # Browser tests of /dashboard (Playwright + axe-core, light and dark themes).
  dashboard-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseq
          POSTGRES_PASSWORD: leaseq
          POSTGRES_DB: leaseq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseq -d leaseq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@localhost:5432/leaseq
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest -v tests/test_dashboard_e2e.py

  # The real Docker stack (postgres, API, worker) end to end. The demo feeder is
  # scaled to 0 so the browser test starts from an empty queue.
  compose:
    runs-on: ubuntu-latest
    env:
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # Compose refuses to start without a token; make a throwaway one, masked in logs.
      - run: |
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "LEASEQ_API_TOKEN=$token" >> "$GITHUB_ENV"
      - run: docker compose up --build -d --scale demo=0
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - name: wait for the API
        run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done; exit 1
      - name: dashboard in a browser against the compose stack
        run: BASE_URL=http://127.0.0.1:8000 API_TOKEN="$LEASEQ_API_TOKEN" node tests/e2e/live_flow.e2e.js
      - name: API smoke test against the compose stack
        run: scripts/smoke.sh http://127.0.0.1:8000
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
