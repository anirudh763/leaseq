name: ci

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseq
          POSTGRES_PASSWORD: leaseq
          POSTGRES_DB: leaseq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseq -d leaseq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@localhost:5432/leaseq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # The tests create their own random API token (tests/conftest.py, scripts/harness.py).
      - run: python -m pytest -v

  # Browser tests of /dashboard (Playwright + axe-core, light and dark themes).
  dashboard-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseq
          POSTGRES_PASSWORD: leaseq
          POSTGRES_DB: leaseq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseq -d leaseq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@localhost:5432/leaseq
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest -v tests/test_dashboard_e2e.py

  # The real Docker stack (postgres, API, worker) end to end. The demo feeder is
  # scaled to 0 so the browser test starts from an empty queue.
  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: leaseq-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # Gate 1: a bare `docker compose up` with no .env and no token must refuse
      # to start, and must not leave any container behind.
      - name: bare docker compose up fails closed without a token
        run: |
          test ! -e .env
          test -z "${LEASEQ_API_TOKEN:-}"
          if docker compose up -d --build --scale demo=0 2>"$RUNNER_TEMP/err.txt"; then
            echo "docker compose up started without LEASEQ_API_TOKEN"; exit 1
          fi
          cat "$RUNNER_TEMP/err.txt"
          grep -q "LEASEQ_API_TOKEN" "$RUNNER_TEMP/err.txt"
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
      # Gate 2: fresh run of scripts/up.sh with no token anywhere: it writes a
      # random token to .env (mode 600) and the stack accepts exactly that token.
      - name: scripts/up.sh, fresh, no token set
        run: |
          scripts/up.sh --scale demo=0
          test "$(stat -c %a .env)" = 600
          token=$(sed -n 's/^LEASEQ_API_TOKEN=//p' .env)
          test "${#token}" -ge 32
          echo "::add-mask::$token"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" http://127.0.0.1:8000/auth/check)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer wrong-token-0123456789" http://127.0.0.1:8000/auth/check)" = 401
          git check-ignore -q .env
          test -z "$(git status --porcelain)"
          echo "LEASEQ_API_TOKEN=$token" >> "$GITHUB_ENV"
      # Gate 3: a re-run must not overwrite .env, and the running stack keeps
      # accepting the same token. Run without the token in the environment so
      # only .env can supply it.
      - name: scripts/up.sh re-run keeps .env
        run: |
          before=$(sha256sum .env)
          env -u LEASEQ_API_TOKEN scripts/up.sh --scale demo=0
          test "$(sha256sum .env)" = "$before"
          test "$(stat -c %a .env)" = 600
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LEASEQ_API_TOKEN" http://127.0.0.1:8000/auth/check)" = 200
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - name: wait for the API
        run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done; exit 1
      - name: dashboard in a browser against the compose stack
        run: BASE_URL=http://127.0.0.1:8000 API_TOKEN="$LEASEQ_API_TOKEN" node tests/e2e/live_flow.e2e.js
      - name: API smoke test against the compose stack, with the token from .env
        run: LEASEQ_API_TOKEN="$(sed -n 's/^LEASEQ_API_TOKEN=//p' .env)" scripts/smoke.sh http://127.0.0.1:8000
      - name: word_count result survives a worker kill and restart; nothing completes twice
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time, uuid, urllib.request

          def request(path, body=None, key=None):
              headers = {"Authorization": "Bearer " + os.environ["LEASEQ_API_TOKEN"]}
              if key is not None:
                  headers["Idempotency-Key"] = key
              data = None if body is None else json.dumps(body).encode()
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request("http://127.0.0.1:8000" + path, data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)

          def wait(job_id, state, seconds=180):
              for _ in range(seconds * 2):
                  job = request(f"/jobs/{job_id}")
                  if job["state"] == state:
                      return job
                  time.sleep(0.5)
              raise AssertionError(f"job {job_id} stuck in {job['state']}")

          run = uuid.uuid4().hex
          text = "the quick brown fox\njumps over\nthe lazy dog"
          a = wait(request("/jobs", {"kind": "word_count", "payload": {"text": text}}, f"wc-a-{run}")["id"], "done")
          assert a["result"] == {"words": 9, "lines": 3}, a["result"]
          a_events = request(f"/jobs/{a['id']}/events")

          # A job the worker is running when it is killed (SIGKILL, no cleanup).
          b_id = request("/jobs", {"kind": "sleep", "payload": {"ms": 4000}}, f"sleep-b-{run}")["id"]
          wait(b_id, "leased", 60)
          subprocess.run(["docker", "compose", "kill", "-s", "SIGKILL", "worker"], check=True)
          subprocess.run(["docker", "compose", "start", "worker"], check=True)
          b = wait(b_id, "done")             # re-claimed after the 30 s lease expires
          c = wait(request("/jobs", {"kind": "word_count", "payload": {"text": text}}, f"wc-c-{run}")["id"], "done")
          assert c["result"] == {"words": 9, "lines": 3}, c["result"]

          assert request(f"/jobs/{a['id']}") == a, "word_count result changed after the restart"
          assert request(f"/jobs/{a['id']}/events") == a_events, "audit log changed after the restart"
          for j in (a, b, c):
              ev = [e["event"] for e in request(f"/jobs/{j['id']}/events")["events"]]
              assert ev.count("completed") == 1, (j["id"], ev)
          ids = ",".join(str(j["id"]) for j in (a, b, c))
          rows = subprocess.run(["docker", "compose", "exec", "-T", "postgres", "psql", "-U", "leaseq",
                                 "-d", "leaseq", "-Atc",
                                 f"SELECT job_id, count(*) FROM effects WHERE job_id IN ({ids}) GROUP BY 1 ORDER BY 1"],
                                check=True, capture_output=True, text=True).stdout.split()
          assert rows == [f"{j['id']}|1" for j in (a, b, c)], rows
          print(f"word_count {a['result']} kept across a worker SIGKILL+restart; job {b_id} attempts={b['attempts']}; "
                f"one completed event and one effect row each for jobs {ids}")
          PY
      - name: Preserve jobs and audit history across down/up
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import uuid
          import urllib.request

          def request(path, body=None, key=None):
              headers = {"Authorization": "Bearer " + os.environ["LEASEQ_API_TOKEN"]}
              if key is not None:
                  headers["Idempotency-Key"] = key
              data = None if body is None else json.dumps(body).encode()
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request("http://127.0.0.1:8000" + path,
                                           data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)

          marker = "retention-" + uuid.uuid4().hex
          submitted = request("/jobs", {"kind": "noop", "payload": {"marker": marker}}, marker)
          path = "/jobs/" + str(submitted["id"])
          for _ in range(120):
              job = request(path)
              if job["state"] == "done":
                  break
              time.sleep(1)
          else:
              raise AssertionError("retention job did not finish before shutdown")
          assert job["payload"]["marker"] == marker
          assert job["result"] is not None
          events = request(path + "/events")
          assert any(e["event"] == "completed" for e in events["events"])

          subprocess.run(["docker", "compose", "down"], check=True)
          subprocess.run(["docker", "compose", "up", "-d", "--wait", "--wait-timeout", "90"],
                         check=True)
          # Read the original job before submitting anything after recreation.
          assert request(path) == job, "job or result did not survive down/up"
          assert request(path + "/events") == events, "audit history did not survive down/up"
          print("retention check passed: existing job, result and audit events survived down/up")
          PY
      - if: failure()
        run: docker compose logs
      - if: always()
        # This project's CI data is disposable; ordinary local shutdown omits -v.
        run: docker compose down -v
