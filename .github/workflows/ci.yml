name: ci

on:
  push:
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseq
          POSTGRES_PASSWORD: leaseq
          POSTGRES_DB: leaseq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseq -d leaseq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@localhost:5432/leaseq
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      # The tests create their own random API token (tests/conftest.py, scripts/harness.py).
      - run: python -m pytest -v

  # Browser tests of /dashboard (Playwright + axe-core, light and dark themes).
  dashboard-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: leaseq
          POSTGRES_PASSWORD: leaseq
          POSTGRES_DB: leaseq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leaseq -d leaseq"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@localhost:5432/leaseq
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: python -m pytest -v tests/test_dashboard_e2e.py

  # The real Docker stack (postgres, API, worker) end to end. The demo feeder is
  # scaled to 0 so the browser test starts from an empty queue.
  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: leaseq-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AXE_PATH: node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      # A bare `docker compose` with no .env and no token must refuse to start.
      - name: compose fails closed without a token
        run: |
          test ! -e .env
          test -z "${LEASEQ_API_TOKEN:-}"
          if docker compose config >/dev/null 2>err.txt; then
            echo "docker compose accepted a missing LEASEQ_API_TOKEN"; exit 1
          fi
          grep -q LEASEQ_API_TOKEN err.txt
          cat err.txt
      # scripts/up.sh with no token set: it writes a random one to .env and starts the stack.
      - name: scripts/up.sh
        run: scripts/up.sh --scale demo=0
      - name: read the token from .env (masked in logs)
        run: |
          test "$(stat -c %a .env)" = 600
          token=$(sed -n 's/^LEASEQ_API_TOKEN=//p' .env)
          test "${#token}" -ge 32
          echo "::add-mask::$token"
          echo "LEASEQ_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: a second scripts/up.sh keeps the token
        run: |
          before=$(sha256sum .env)
          scripts/up.sh --scale demo=0
          test "$(sha256sum .env)" = "$before"
      - run: npm install --no-save playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - name: wait for the API
        run: for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done; exit 1
      - name: dashboard in a browser against the compose stack
        run: BASE_URL=http://127.0.0.1:8000 API_TOKEN="$LEASEQ_API_TOKEN" node tests/e2e/live_flow.e2e.js
      - name: API smoke test against the compose stack, with the token from .env
        run: LEASEQ_API_TOKEN="$(sed -n 's/^LEASEQ_API_TOKEN=//p' .env)" scripts/smoke.sh http://127.0.0.1:8000
      - name: Preserve jobs and audit history across down/up
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time
          import uuid
          import urllib.request

          def request(path, body=None, key=None):
              headers = {"Authorization": "Bearer " + os.environ["LEASEQ_API_TOKEN"]}
              if key is not None:
                  headers["Idempotency-Key"] = key
              data = None if body is None else json.dumps(body).encode()
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request("http://127.0.0.1:8000" + path,
                                           data=data, headers=headers)
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)

          marker = "retention-" + uuid.uuid4().hex
          submitted = request("/jobs", {"kind": "noop", "payload": {"marker": marker}}, marker)
          path = "/jobs/" + str(submitted["id"])
          for _ in range(120):
              job = request(path)
              if job["state"] == "done":
                  break
              time.sleep(1)
          else:
              raise AssertionError("retention job did not finish before shutdown")
          assert job["payload"]["marker"] == marker
          assert job["result"] is not None
          events = request(path + "/events")
          assert any(e["event"] == "completed" for e in events["events"])

          subprocess.run(["docker", "compose", "down"], check=True)
          subprocess.run(["docker", "compose", "up", "-d", "--wait", "--wait-timeout", "90"],
                         check=True)
          # Read the original job before submitting anything after recreation.
          assert request(path) == job, "job or result did not survive down/up"
          assert request(path + "/events") == events, "audit history did not survive down/up"
          print("retention check passed: existing job, result and audit events survived down/up")
          PY
      - if: failure()
        run: docker compose logs
      - if: always()
        # This project's CI data is disposable; ordinary local shutdown omits -v.
        run: docker compose down -v
