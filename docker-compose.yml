# PostgreSQL + API + one worker + a demo feeder.
#
# Every request to the API needs a bearer token, and there is no default one.
# Easiest: scripts/up.sh, which puts a random token in .env (chmod 600) and
# starts this file. By hand:
#     export LEASEQ_API_TOKEN=$(openssl rand -hex 24)
#     docker compose up --build
# Then open http://127.0.0.1:8000/dashboard/ and paste the token when asked.
# The API is published on 127.0.0.1 only. Job reads need the token too; to open
# them (payloads included) to anyone who can reach the port, add
# LEASEQ_PUBLIC_READ: "1" to the app service.
x-leaseq-env: &leaseq-env
  LEASEQ_DATABASE_URL: postgresql://leaseq:leaseq@postgres:5432/leaseq
  LEASEQ_API_TOKEN: ${LEASEQ_API_TOKEN:?set LEASEQ_API_TOKEN to a random value of 16+ characters, for example the output of openssl rand -hex 24}

services:
  postgres:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: leaseq
      POSTGRES_PASSWORD: leaseq      # not a secret: the database is not published to the host
      POSTGRES_DB: leaseq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaseq -d leaseq"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment: *leaseq-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker:
    build: .
    command: ["python", "-m", "leaseq.worker", "--api", "http://app:8000", "--worker-id", "compose-worker"]
    environment: *leaseq-env
    depends_on:
      app:
        condition: service_healthy
    restart: on-failure

  # Enqueues one batch of sample jobs, then a few more every 3-8 s for 10
  # minutes, so the dashboard shows jobs moving. Remove this service to start empty.
  demo:
    build: .
    command: ["python", "-m", "leaseq.demo", "--api", "http://app:8000", "--trickle-minutes", "10"]
    environment: *leaseq-env
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
