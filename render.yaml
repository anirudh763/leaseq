# Manual deployment template. These are paid resources; creating a Blueprint can incur charges.
services:
  - type: web
    name: leaseq-api
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: "off"
    healthCheckPath: /readyz
    envVars:
      - fromGroup: leaseq-private
      - key: LEASEQ_PUBLIC_READ
        value: "0"
      - key: LEASEQ_DATABASE_URL
        fromDatabase:
          name: leaseq-postgres
          property: connectionString
  - type: worker
    name: leaseq-worker
    runtime: docker
    plan: starter
    region: ohio
    branch: main
    autoDeployTrigger: "off"
    dockerCommand: >-
      sh -c 'exec python -m leaseq.worker --api "http://${LEASEQ_API_HOSTPORT}" --worker-id "${RENDER_INSTANCE_ID:-render-worker}"'
    envVars:
      - fromGroup: leaseq-private
      - key: LEASEQ_API_HOSTPORT
        fromService:
          type: web
          name: leaseq-api
          property: hostport
      - key: LEASEQ_DATABASE_URL
        fromDatabase:
          name: leaseq-postgres
          property: connectionString
databases:
  - name: leaseq-postgres
    region: ohio
    plan: basic-256mb
    databaseName: leaseq
    user: leaseq
    ipAllowList: []
envVarGroups:
  - name: leaseq-private
    envVars:
      - key: LEASEQ_API_TOKEN
        generateValue: true
